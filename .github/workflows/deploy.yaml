name: MK Cloud app deployement
'on':
  push:
    branches:
      - master

env:
  ImageName: stats-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/env.imageName:Latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/env.imageName:Latest
            docker stop stats-production-app || true
            docker rm stats-production-app || true
            docker run -d --name stats-production-app -p 80:5000 --restart always \
              -e APP_ENV=production \
              -e APP_VERSION=1.0.0 \
              ${{ secrets.DOCKER_USERNAME }}/env.imageName:Latest