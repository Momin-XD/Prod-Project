version: '3.8'

services:
  stats-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stats-app:latest
    container_name: stats-production-app
    restart: always
    ports:
      - "80:5000"
    environment:
      - APP_ENV=production
      - APP_VERSION=1.0.0
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/api/status\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
